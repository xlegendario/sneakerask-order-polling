<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Arial;
      padding: 10px;
      width: 200px;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      cursor: pointer;
    }
    #status {
      margin-top: 10px;
      font-weight: bold;
    }
    label {
      display: block;
      margin-top: 8px;
      font-size: 12px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 6px;
    }
    .hint,
    #loginStatus {
      font-size: 11px;
      color: #555;
      margin-top: 6px;
    }
  </style>
</head>
<body>

<h3>Bot Control</h3>

<button id="start">Start Polling</button>
<button id="stop">Force Stop</button>

<div id="status">Status: ...</div>

<h3>SneakerAsk login</h3>
<p class="hint">Used to sign back in when SneakerAsk signs the checker out. Stored only in this browser.</p>

<label for="saEmail">Email</label>
<input id="saEmail" type="email" autocomplete="off">

<label for="saPassword">Password</label>
<input id="saPassword" type="password" autocomplete="off">

<label for="saOtp">One-time code</label>
<input id="saOtp" type="text" inputmode="numeric" autocomplete="off">

<button id="saveLogin">Save login</button>
<div id="loginStatus"></div>

<script src="popup.js"></script>
</body>
</html>
